<title>Healthyfi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: phone-width app shell, centered on desktop, fixed bottom tab bar, cards only for the logging units */
:root{
  --bg:#F2F6F1; --surface:#FFFFFF; --sunk:#E6EEE6; --line:#D5E0D5;
  --fg:#15211A; --muted:#5C6E62;
  --leaf:#17803F; --leaf-soft:#D8F0DF; --on-leaf:#FFFFFF;
  --haldi:#D97A06; --haldi-soft:#FCEBD2;
  --protein:#7C4DDB; --carbs:#D99A0B; --fat:#1A8FC9; --water:#1C8BD6;
  --danger:#C2352B;
  --display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body:"Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1410; --surface:#162019; --sunk:#1E2A22; --line:#2A3A2F;
  --fg:#E7F0E9; --muted:#93A699;
  --leaf:#4CC977; --leaf-soft:#173D25; --on-leaf:#06210F;
  --haldi:#F5A23A; --haldi-soft:#3A2810;
  --protein:#A586F0; --carbs:#EDB93A; --fat:#4FB4E8; --water:#4FA9EC; --danger:#F07468;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1410; --surface:#162019; --sunk:#1E2A22; --line:#2A3A2F;
  --fg:#E7F0E9; --muted:#93A699;
  --leaf:#4CC977; --leaf-soft:#173D25; --on-leaf:#06210F;
  --haldi:#F5A23A; --haldi-soft:#3A2810;
  --protein:#A586F0; --carbs:#EDB93A; --fat:#4FB4E8; --water:#4FA9EC; --danger:#F07468;
  color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.45 var(--body);font-variant-numeric:tabular-nums;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--leaf);outline-offset:2px}
.app{max-width:480px;margin:0 auto;padding-inline:16px;padding-block:8px calc(88px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
h1,h2,h3{margin:0;font-family:var(--display);text-wrap:balance}
h1{font-size:26px;font-weight:800;letter-spacing:-.01em}
h2{font-size:17px;font-weight:600}
.muted{color:var(--muted)}
.small{font-size:13px}
.label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:6px}
.brand{font-family:var(--display);font-weight:800;font-size:22px;color:var(--leaf);letter-spacing:-.02em}
.sync{font-size:12px;color:var(--muted);background:var(--sunk);border-radius:999px;padding:4px 10px;white-space:nowrap}

.datebar{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px}
.datebar strong{flex:1;text-align:center;font-weight:600}
.iconbtn{width:38px;height:38px;border-radius:50%;border:0;background:transparent;font-size:20px;display:grid;place-items:center}
.iconbtn:hover:not(:disabled){background:var(--sunk)}
.iconbtn:disabled{opacity:.3;cursor:default}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.card-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.card-head .meta{font-size:13px;color:var(--muted);font-weight:600}

/* calorie hero */
.hero{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.stat{display:flex;flex-direction:column;align-items:center;gap:0;text-align:center;min-width:0}
.stat b{font-family:var(--display);font-size:22px;font-weight:600}
.stat span{font-size:12px;color:var(--muted)}
.ring{position:relative;width:150px;height:150px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .center{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .center b{font-family:var(--display);font-size:34px;font-weight:800;line-height:1}
.ring .center span{font-size:12px;color:var(--muted)}
.ring.over .center b{color:var(--haldi)}
.macros{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.bar{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;transition:width .4s}
.macro b{font-size:13px}

.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.btn{border:0;border-radius:12px;padding:10px 16px;font-weight:600;background:var(--leaf);color:var(--on-leaf)}
.btn.ghost{background:transparent;color:var(--leaf);border:1px solid var(--line)}
.btn.soft{background:var(--leaf-soft);color:var(--fg)}
.btn.block{width:100%;padding:13px}
.btn:disabled{opacity:.45;cursor:default}
.btn.danger{color:var(--danger);background:transparent;border:1px solid var(--line)}

.glasses{display:flex;flex-wrap:wrap;gap:6px}
.glass{width:26px;height:32px;border-radius:4px 4px 8px 8px;border:2px solid var(--water);background:transparent;padding:0}
.glass.full{background:var(--water)}

.check{display:flex;align-items:center;gap:12px;padding:8px 0;border:0;background:none;text-align:left;width:100%}
.check .box{width:22px;height:22px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;font-size:14px;color:var(--on-leaf);flex:none}
.check.on .box{background:var(--leaf);border-color:var(--leaf)}
.check.on .txt{color:var(--muted);text-decoration:line-through}

.fields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.fields.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:12px;color:var(--muted);font-weight:600}
.field input{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 12px;min-width:0}
.field input:focus{border-color:var(--leaf);outline:none}

.tips{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.tips li{padding-left:14px;position:relative}
.tips li::before{content:"";position:absolute;left:0;top:.6em;width:6px;height:6px;border-radius:50%;background:var(--haldi)}

/* food */
.summary{background:var(--leaf-soft);border-radius:var(--r);padding:14px 16px;display:grid;grid-template-columns:1.4fr repeat(3,1fr);gap:6px}
.entry{display:flex;align-items:center;gap:10px;padding:6px 0;border-top:1px solid var(--line)}
.entry:first-of-type{border-top:0}
.entry .name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.entry .kcal{font-weight:700}
.x{border:0;background:none;color:var(--muted);font-size:18px;width:32px;height:32px;border-radius:50%}
.x:hover{background:var(--sunk);color:var(--danger)}
.actions{display:flex;gap:8px;flex-wrap:wrap}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(5,15,9,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:480px;max-height:88%;border-radius:22px 22px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.list{overflow-y:auto;min-height:0;flex:1;margin-inline:-4px}
.item{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:10px 4px;border-bottom:1px solid var(--line);text-align:left}
.item:hover{background:var(--sunk)}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-size:20px}
.stepper input{text-align:center;font-size:20px;font-weight:700}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;white-space:nowrap;font-size:13px;font-weight:600}
.chip.on{background:var(--leaf);color:var(--on-leaf);border-color:var(--leaf)}
.section-label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:8px 4px 2px}

/* workout */
.wo{display:flex;align-items:center;gap:12px}
.wo .ic{width:40px;height:40px;border-radius:12px;background:var(--haldi-soft);display:grid;place-items:center;font-size:20px;flex:none}
.pb{font-size:12px;font-weight:700;color:var(--haldi)}

/* progress */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}
.tile b{display:block;font-family:var(--display);font-size:22px;font-weight:600}
.tile span{font-size:12px;color:var(--muted)}
svg.chart{width:100%;height:auto;display:block}
svg.chart text{fill:var(--muted);font:11px var(--body)}

.confirm{background:var(--haldi-soft);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs nav{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{border:0;background:none;padding:10px 0 9px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted)}
.tab .g{font-size:20px;width:52px;height:28px;border-radius:99px;display:grid;place-items:center;transition:background .2s}
.tab.on{color:var(--fg)}
.tab.on .g{background:var(--leaf-soft)}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:13px;font-weight:600;z-index:30}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

function fatTarget(p=P()){return R(kcalTarget(p)*.25/9)}
function carbTarget(p=P()){return Math.max(0,R((kcalTarget(p)-proteinTarget(p)*4-fatTarget(p)*9)/4))}
function totals(date){const f=day(date).foods;const t={kcal:0,p:0,c:0,f:0};f.forEach(e=>{t.kcal+=e.kcal*e.servings;t.p+=e.protein*e.servings;t.c+=e.carbs*e.servings;t.f+=e.fat*e.servings});return t}
function burned(date){return day(date).workouts.reduce((a,w)=>a+w.kcal,0)}
function met(name,cardio){const e=name.toLowerCase();if(!cardio)return 5;if(e.includes("run"))return 9.8;if(e.includes("skip")||e.includes("rope"))return 11;if(e.includes("cycl")||e.includes("bike"))return 7.5;if(e.includes("swim"))return 8;if(e.includes("walk"))return 3.5;if(e.includes("yoga"))return 3;if(e.includes("badminton"))return 5.5;if(e.includes("cricket"))return 5;return 6}

// ---------- persistence ----------
let db=null, userPath=null;
const timers={}, pendingKeys=new Set(), chains={};
function lsSave(){try{localStorage.setItem("healthyfi",JSON.stringify(S))}catch(e){}}
function lsLoad(){try{const v=localStorage.getItem("healthyfi");if(v){const o=JSON.parse(v);S={profile:{...DEFAULT_PROFILE,...o.profile},customFoods:o.customFoods||[],days:o.days||{}}}}catch(e){}}
function docFor(key){return db.collection(userPath).doc(key)}
function bodyFor(key){return key==="profile"?{profile:S.profile,customFoods:S.customFoods}:{date:key.slice(1),...day(key.slice(1))}}
function persist(key){ // key: "profile" or "d"+date
  lsSave();
  if(!db) return;
  pendingKeys.add(key);
  clearTimeout(timers[key]);
  timers[key]=setTimeout(()=>{
    delete timers[key];
    const body=JSON.parse(JSON.stringify(bodyFor(key)));
    chains[key]=(chains[key]||Promise.resolve()).then(()=>docFor(key).set(body)).catch(err=>{
      if(err&&err.code==="quota_exceeded") toast("Storage is full. Clear old logs on the Me tab.");
    }).finally(()=>{if(!timers[key]) pendingKeys.delete(key)});
  },500);
}
const saveProfile=()=>persist("profile");
const saveDay=d=>persist("d"+d);

async function connect(){
  if(!window.claude||!window.claude.use) return;
  try{
    const [dbx,user]=await Promise.all([claude.use("db"),claude.use("user")]);
    if(!dbx||!user) return;
    const id=await user.id();
    if(!id) return;
    db=dbx; userPath="data/users/"+id;
    let first=true;
    db.collection(userPath).onSnapshot(snap=>{
      if(first&&snap.metadata.fromCache) return;
      if(first){
        first=false; sync="db";
        if(snap.empty&&(P().onboarded||Object.keys(S.days).length)){ // move browser data to the account
          saveProfile(); Object.keys(S.days).forEach(saveDay);
          render(); return;
        }
      }
      snap.docs.forEach(d=>{
        if(!d.exists||pendingKeys.has(d.id)) return;
        const v=d.data();
        if(d.id==="profile"){S.profile={...DEFAULT_PROFILE,...(v.profile||{})};S.customFoods=v.customFoods||[]}
        else if(d.id[0]==="d"&&v.date){S.days[v.date]={foods:v.foods||[],workouts:v.workouts||[],body:v.body||{},water:v.water||0,supps:v.supps||[]}}
      });
      lsSave(); render();
    },()=>{db=null;sync="local";render()});
  }catch(e){}
}

// ---------- UI helpers ----------
function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.hidden=false;clearTimeout(t._t);t._t=setTimeout(()=>t.hidden=true,1800)}
function dateLabel(d){const t=iso(new Date());if(d===t)return"Today";if(d===addDays(t,-1))return"Yesterday";return new Date(d+"T12:00:00").toLocaleDateString("en-IN",{weekday:"short",day:"numeric",month:"short"})}
function datebar(){const t=iso(new Date());return `<div class="datebar"><button class="iconbtn" data-a="prev" aria-label="Previous day">‹</button><strong>${dateLabel(ui.date)}</strong><button class="iconbtn" data-a="next" aria-label="Next day" ${ui.date>=t?"disabled":""}>›</button></div>`}
function macro(label,v,t,c){const pct=t?Math.min(100,v/t*100):0;return `<div class="macro"><div class="label">${label}</div><div class="bar" style="margin:6px 0"><i style="width:${pct}%;background:${c}"></i></div><b>${R(v)}</b><span class="muted small"> / ${t} g</span></div>`}
function field(id,label,val,type="decimal"){return `<div class="field"><label for="${id}">${label}</label><input id="${id}" inputmode="${type}" value="${esc(val)}"></div>`}

function tips(){
  const p=P(), d=day(ui.date), t=totals(ui.date), out=[];
  const left=kcalTarget()-R(t.kcal)+burned(ui.date), pl=proteinTarget()-R(t.p);
  if(!d.foods.length) out.push("Nothing logged yet. Log as you eat; it's far more accurate than guessing at night.");
  if(pl>10) out.push(`<b>${pl} g protein</b> to go. Quick wins: whey scoop 24 g, 100 g chicken breast 31 g, 100 g paneer 18 g, 50 g soya chunks 26 g, 3 egg whites 11 g.`);
  else if(d.foods.length) out.push("Protein target hit. 💪");
  if(left<-150) out.push(`You're ${-left} kcal over. A 30-minute brisk walk burns about 150 kcal.`);
  if(d.water<p.waterTarget) out.push(`${p.waterTarget-d.water} more glasses of water today.`);
  const miss=p.supplements.filter(s=>!d.supps.includes(s)); if(miss.length) out.push(`Still to take: ${esc(miss.join(", "))}.`);
  if(d.body&&d.body.sleep&&d.body.sleep<7) out.push(`Only ${fmt(d.body.sleep)} h sleep. Aim for 7–8 h; recovery is where muscle gets built.`);
  if(!d.workouts.length&&ui.date===iso(new Date())) out.push("No workout logged today yet.");
  if(!out.length) out.push("Everything's on track today.");
  return out;
}

function progress(){
  const p=P(), today=iso(new Date());

  const weights=Object.keys(S.days).sort().filter(d=>S.days[d].body&&S.days[d].body.w).slice(-30).map(d=>({d,w:+S.days[d].body.w}));
  let streak=0, cur=today; if(!day(cur).foods.length) cur=addDays(cur,-1); while(day(cur).foods.length){streak++;cur=addDays(cur,-1)}
  const woDays=days.filter(d=>day(d).workouts.length).length;
  const bmi=p.weightKg/((p.heightCm/100)**2), bmiL=bmi<18.5?"Underweight":bmi<23?"Healthy":bmi<25?"Overweight":"Obese";
  return `

}

function weightChart(pts,goal){
  const W=340,H=170,L=34,Rt=10,T=10,B=24;
  const vals=pts.map(p=>p.w).concat(goal); let mn=Math.floor(Math.min(...vals)-1), mx=Math.ceil(Math.max(...vals)+1);
  const x=i=>L+(W-L-Rt)*i/(pts.length-1), y=v=>T+(H-T-B)*(1-(v-mn)/(mx-mn));
  const ticks=[mn,R((mn+mx)/2),mx];
  const line=pts.map((p,i)=>`${i?"L":"M"}${x(i).toFixed(1)},${y(p.w).toFixed(1)}`).join("");
  const area=line+`L${x(pts.length-1).toFixed(1)},${H-B}L${L},${H-B}Z`;
  const first=pts[0], last=pts[pts.length-1], diff=last.w-first.w, toGo=goal-last.w;
  return `<div><b style="font-size:20px;font-family:var(--display)">${fmt(last.w)} kg</b> <span class="muted small">${diff>=0?"+":""}${fmt(R(diff*10)/10)} kg since ${first.d.slice(5)}</span></div>
  <svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Weight trend">
    ${ticks.map(t=>`<line x1="${L}" x2="${W-Rt}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)"/><text x="${L-6}" y="${y(t)+4}" text-anchor="end">${t}</text>`).join("")}
    <line x1="${L}" x2="${W-Rt}" y1="${y(goal)}" y2="${y(goal)}" stroke="var(--haldi)" stroke-width="2" stroke-dasharray="6 5"/>
    <path d="${area}" fill="var(--leaf)" fill-opacity=".12"/>
    <path d="${line}" fill="none" stroke="var(--leaf)" stroke-width="2.5" stroke-linejoin="round"/>
    <circle cx="${x(pts.length-1)}" cy="${y(last.w)}" r="5" fill="var(--leaf)"/>
    <text x="${L}" y="${H-6}">${first.d.slice(5)}</text><text x="${W-Rt}" y="${H-6}" text-anchor="end">${last.d.slice(5)}</text>
  </svg>
  <div class="muted small">${Math.abs(toGo)<.5?"You're at your goal weight.":`${fmt(R(Math.abs(toGo)*10)/10)} kg to ${toGo<0?"lose":"gain"}`}</div>`;
}

function bars(vals,labels,target,color){
  const W=340,H=150,T=8,B=22, mx=Math.max(target,...vals)*1.12||1, slot=W/vals.length, bw=slot*.55;
  const y=v=>T+(H-T-B)*(1-v/mx);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Last 7 days">
    ${vals.map((v,i)=>{const x=i*slot+(slot-bw)/2, h=(H-T-B)*v/mx;return `<rect x="${x}" y="${T}" width="${bw}" height="${H-T-B}" rx="7" fill="var(--sunk)"/>${h>0?`<rect x="${x}" y="${y(v)}" width="${bw}" height="${h}" rx="7" fill="${v>target*1.1?"var(--haldi)":color}"/>`:""}<text x="${x+bw/2}" y="${H-6}" text-anchor="middle">${labels[i]}</text>`}).join("")}
    <line x1="0" x2="${W}" y1="${y(target)}" y2="${y(target)}" stroke="var(--fg)" stroke-opacity=".5" stroke-dasharray="5 5"/>
  </svg>`;
}

    <div class="muted small">Per ${esc(it.unit)}: ${R(it.kcal)} kcal · P ${fmt(it.protein)} g · C ${fmt(it.carbs)} g · F ${fmt(it.fat)} g</div>
    <div class="stepper"><button data-a="sv-" aria-label="Less">−</button><div class="field grow"><input id="sv" inputmode="decimal" value="${esc(s.servings)}" aria-label="Servings" data-focus></div><button data-a="sv+" aria-label="More">+</button></div>
    <div style="font-family:var(--display);font-size:20px;color:var(--leaf);font-weight:600">${R(it.kcal*sv)} kcal · ${R(it.protein*sv)} g protein</div>
    <div class="actions"><button class="btn ghost" data-a="back">Back</button><button class="btn grow" data-a="add-it" ${sv>0?"":"disabled"}>Add to ${s.meal}</button></div>`}
  const q=(s.q||"").trim().toLowerCase(), all=allFoods();
  let groups;
  if(!q){const names=[...new Set(Object.keys(S.days).sort().reverse().flatMap(d=>S.days[d].foods.slice().reverse().map(e=>e.name)))].slice(0,8);
    const recent=names.map(n=>all.find(f=>f.name===n)).filter(Boolean);
    groups=[["Recent",recent],["All foods",all.filter(f=>!recent.includes(f))]];}
  else groups=[["Results",all.filter(f=>f.name.toLowerCase().includes(q))]];
  window._list=[];
  const html=groups.filter(g=>g[1].length).map(([lab,arr])=>`<div class="section-label">${lab}</div>`+arr.map(f=>{window._list.push(f);return `<button class="item" data-a="pick" data-i="${window._list.length-1}"><span class="grow"><span style="font-weight:600">${esc(f.name)}</span><br><span class="muted small">${esc(f.unit)} · P ${fmt(f.protein)} g</span></span><span class="small" style="font-weight:600">${R(f.kcal)} kcal</span></button>`}).join("")).join("");
  return `<div class="row"><h2 class="grow">Add to ${s.meal}</h2><button class="x" data-a="close" aria-label="Close">✕</button></div>
    <div class="field"><input id="q" placeholder="Search idli, chicken, paneer…" value="${esc(s.q||"")}" aria-label="Search foods" data-focus></div>
    <div class="list">${html||`<p class="muted" style="padding:12px 4px">No match. Add it as a custom food.</p>`}</div>
    <button class="btn soft" data-a="custom">+ Custom food</button>`;
}
function woSheet(s){
  const past=[...new Set(Object.keys(S.days).sort().reverse().flatMap(d=>S.days[d].workouts.map(w=>w.exercise)))];
  const isC=n=>CARDIO.some(c=>c.toLowerCase()===n.toLowerCase());
  const sug=[...past.filter(n=>s.cardio?isC(n):!isC(n)),...(s.cardio?CARDIO:STRENGTH)].filter((n,i,a)=>a.findIndex(m=>m.toLowerCase()===n.toLowerCase())===i).filter(n=>!s.name||n.toLowerCase().includes(s.name.toLowerCase())).slice(0,12);
  const k=woKcal(s);
  return `<div class="row"><h2 class="grow">Log exercise</h2><button class="x" data-a="close" aria-label="Close">✕</button></div>
    <div class="chips"><button class="chip ${!s.cardio?"on":""}" data-a="wo-kind" data-v="0">Strength</button><button class="chip ${s.cardio?"on":""}" data-a="wo-kind" data-v="1">Cardio</button></div>
    <div class="field"><label for="w-name">Exercise</label><input id="w-name" value="${esc(s.name)}" data-focus></div>
    <div class="chips">${sug.map(n=>`<button class="chip" data-a="wo-sug" data-v="${esc(n)}">${esc(n)}</button>`).join("")}</div>
    ${s.cardio?`<div class="fields two">${field("w-min","Minutes",s.minutes,"numeric")}</div>`
      :`<div class="fields">${field("w-sets","Sets",s.sets,"numeric")}${field("w-reps","Reps",s.reps,"numeric")}${field("w-kg","kg",s.kg)}</div>`}
    <div id="w-k" style="color:var(--leaf);font-weight:700">About ${k} kcal burned</div>
    <button class="btn block" data-a="save-wo">Add</button>`;
}
function woKcal(s){const m=s.cardio?(+s.minutes||0):(+s.sets||0)*3;return R(met(s.name||"",s.cardio)*P().weightKg*m/60)}

// ---------- render ----------
const TABS=[["home","🏠","Home"],["food","🍛","Food"],["workout","🏋️","Workout"],["progress","📈","Progress"],["me","👤","Me"]];
function render(){
  const app=document.getElementById("app");
  const ob=!P().onboarded;
  const head=`<div class="top"><span class="brand">Healthyfi</span><span class="sync">${sync==="db"?"Synced":"This browser"}</span></div>`;
  app.innerHTML=ob?onboarding():head+({home,food,workout,progress,me}[ui.tab])();
  document.querySelector(".tabs").hidden=ob;
  document.getElementById("tabs").innerHTML=TABS.map(([k,g,l])=>`<button class="tab ${ui.tab===k?"on":""}" data-a="tab" data-v="${k}" aria-current="${ui.tab===k?"page":"false"}"><span class="g">${g}</span>${l}</button>`).join("");
  const pf=document.getElementById("pf"); if(pf){pf._chips={male:P().male,activity:P().activity,goal:P().goal}}
}

// ---------- events ----------
function num(id,d){const v=parseFloat((document.getElementById(id)||{}).value);return isNaN(v)?d:v}
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-a]"); if(!b) return;
  const a=b.dataset.a, d=ui.date;
  if(b.closest("#scrim")||a==="close") return sheetClick(a,b);
  switch(a){
    case "tab": ui.tab=b.dataset.v; ui.saved=false; ui.confirmReset=false; render(); window.scrollTo(0,0); break;
    case "prev": ui.date=addDays(d,-1); render(); break;
    case "next": ui.date=addDays(d,1); render(); break;
    case "water+": ensureDay(d).water++; saveDay(d); render(); break;
    case "water-": {const x=ensureDay(d); x.water=Math.max(0,x.water-1); saveDay(d); render(); break}
    case "water": {const x=ensureDay(d), n=+b.dataset.n; x.water=x.water===n?n-1:n; saveDay(d); render(); break}
    case "supp": {const s=P().supplements[+b.dataset.i], x=ensureDay(d); x.supps=x.supps.includes(s)?x.supps.filter(v=>v!==s):x.supps.concat(s); saveDay(d); render(); break}
    case "body": {
      const x=ensureDay(d), w=num("b-w",null), sl=num("b-s",null), st=num("b-st",null);
      x.body={}; if(w)x.body.w=w; if(sl)x.body.sleep=sl; if(st)x.body.steps=R(st); saveDay(d);
      const newer=Object.keys(S.days).some(k=>k>d&&S.days[k].body&&S.days[k].body.w);
      if(w&&!newer){P().weightKg=w; saveProfile()}
      toast("Body log saved"); render(); break}
    case "add-food": openSheet({kind:"food",meal:b.dataset.m,q:""}); break;
    case "del-food": {const x=ensureDay(d); x.foods=x.foods.filter(f=>f.id!==b.dataset.id); saveDay(d); render(); break}
    case "repeat": {const m=b.dataset.m, x=ensureDay(d); day(addDays(d,-1)).foods.filter(f=>f.meal===m).forEach(f=>x.foods.push({...f,id:uid()})); saveDay(d); toast(`Copied yesterday's ${m.toLowerCase()}`); render(); break}
    case "add-wo": openSheet({kind:"wo",cardio:false,name:"",sets:"3",reps:"10",kg:"",minutes:"30"}); break;
    case "del-wo": {const x=ensureDay(d); x.workouts=x.workouts.filter(w=>w.id!==b.dataset.id); saveDay(d); render(); break}
    case "chip": {const pf=document.getElementById("pf"), n=b.dataset.name, raw=b.dataset.v; pf._chips[n]=n==="male"?raw==="true":n==="activity"?+raw:raw; pf.querySelectorAll(`[data-name="${n}"]`).forEach(c=>c.classList.toggle("on",c===b)); break}
    case "reset": ui.confirmReset=true; render(); break;
    case "reset-no": ui.confirmReset=false; render(); break;
    case "reset-yes": {const keys=Object.keys(S.days); keys.forEach(k=>{S.days[k]={foods:[],workouts:[],body:{},water:0,supps:[]};saveDay(k)}); ui.confirmReset=false; toast("Logs cleared"); render(); break}
  }
});
document.addEventListener("submit",e=>{
  if(e.target.id!=="pf") return; e.preventDefault();
  const p=P(), c=e.target._chips;
  Object.assign(p,{name:document.getElementById("p-name").value.trim(),age:R(num("p-age",p.age)),heightCm:num("p-h",p.heightCm),weightKg:num("p-w",p.weightKg),goalWeightKg:num("p-gw",p.goalWeightKg),male:c.male,activity:c.activity,goal:c.goal,waterTarget:Math.min(20,Math.max(1,R(num("p-water",p.waterTarget)))),stepsTarget:R(num("p-steps",p.stepsTarget)),supplements:document.getElementById("p-supps").value.split(",").map(s=>s.trim()).filter(Boolean)});
  if(!p.onboarded){p.onboarded=true; ui.tab="home"} else {ui.saved=true; toast("Profile saved")}
  saveProfile(); render(); window.scrollTo(0,0);
});
function sheetClick(a,b){
  const s=ui.sheet; if(!s) return;
  const d=ui.date;
  switch(a){
    case "close": closeSheet(); break;
    case "pick": s.item=window._list[+b.dataset.i]; s.servings="1"; renderSheet(); break;
    case "back": s.item=null; s.custom=false; renderSheet(); break;
    case "custom": s.custom=true; renderSheet(); break;
    case "sv-": s.servings=fmt(Math.max(.5,(+s.servings||0)-.5)); renderSheet(); break;
    case "sv+": s.servings=fmt((+s.servings||0)+.5); renderSheet(); break;
    case "add-it": addFood(s.item,+s.servings,false); break;
    case "save-custom": {
      const name=document.getElementById("c-name").value.trim(), k=num("c-k",NaN);
      if(!name||isNaN(k)){toast("Add a name and kcal");return}
      addFood({name,unit:document.getElementById("c-unit").value.trim()||"1 serving",kcal:k,protein:num("c-p",0),carbs:num("c-c",0),fat:num("c-f",0)},1,true); break}
    case "wo-kind": s.cardio=b.dataset.v==="1"; s.name=""; renderSheet(); break;
    case "wo-sug": s.name=b.dataset.v; renderSheet(); break;
    case "save-wo": {
      const ok=s.name.trim()&&(s.cardio?+s.minutes>0:+s.sets>0&&+s.reps>0);
      if(!ok){toast(s.cardio?"Add an exercise and minutes":"Add an exercise, sets and reps");return}
      ensureDay(d).workouts.push({id:uid(),exercise:s.name.trim(),cardio:s.cardio,sets:s.cardio?0:R(+s.sets),reps:s.cardio?0:R(+s.reps),weightKg:s.cardio?0:(+s.kg||0),minutes:s.cardio?R(+s.minutes):R(+s.sets)*3,kcal:woKcal(s)});
      saveDay(d); closeSheet(); toast("Exercise logged"); render(); break}
  }
}
function addFood(it,servings,custom){
  const d=ui.date, s=ui.sheet;
  ensureDay(d).foods.push({id:uid(),meal:s.meal,name:it.name,unit:it.unit,servings,kcal:it.kcal,protein:it.protein,carbs:it.carbs,fat:it.fat});
  if(custom){S.customFoods=S.customFoods.filter(f=>f.name!==it.name).concat(it); saveProfile()}
  saveDay(d); closeSheet(); toast(`Added to ${s.meal.toLowerCase()}`); render();
}
document.addEventListener("input",e=>{
  const s=ui.sheet; if(!s||!e.target.closest("#scrim")) return;
  const id=e.target.id, v=e.target.value;
  if(id==="q"){s.q=v; const pos=e.target.selectionStart; renderSheet(); const q=document.getElementById("q"); q.focus(); q.setSelectionRange(pos,pos)}
  else if(id==="sv"){s.servings=v; const it=s.item, sv=+v||0; const out=e.target.closest(".sheet").querySelector('[data-a="add-it"]'); out.disabled=!(sv>0); e.target.closest(".stepper").nextElementSibling.textContent=`${R(it.kcal*sv)} kcal · ${R(it.protein*sv)} g protein`}
  else if(id.startsWith("w-")){const map={"w-name":"name","w-sets":"sets","w-reps":"reps","w-kg":"kg","w-min":"minutes"}; s[map[id]]=v;
    if(id==="w-name"){const pos=e.target.selectionStart; renderSheet(); const n=document.getElementById("w-name"); n.focus(); n.setSelectionRange(pos,pos)} else document.getElementById("w-k").textContent=`About ${woKcal(s)} kcal burned`}
});
document.getElementById("scrim").addEventListener("click",e=>{if(e.target.id==="scrim") closeSheet()});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&ui.sheet) closeSheet()});

lsLoad(); render(); connect();
</script>
